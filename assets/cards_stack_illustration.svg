<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="display:block; margin:0 auto; max-width:460px;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="aadhaarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3ECF8"/>
      <stop offset="100%" stop-color="#CFDEF2"/>
    </linearGradient>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF4FD"/>
      <stop offset="100%" stop-color="#D6E6F9"/>
    </linearGradient>
    <linearGradient id="dlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F1FC"/>
    </linearGradient>

    <!-- Laser Light Beam -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="laserFlare" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="laserGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#030E22" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. BACK CARD: AADHAAR CARD (Rotated ~8 deg) -->
  <g transform="translate(195, 75) rotate(8)" filter="url(#cardShadow)">
    <rect width="200" height="125" rx="10" fill="url(#aadhaarGrad)" stroke="#B3C8E4" stroke-width="1.5"/>
    <!-- Indian Sun Emblem (Orange/Red) -->
    <circle cx="165" cy="28" r="10" fill="#FF6B00" opacity="0.9"/>
    <path d="M 155,28 Q 165,18 175,28 Q 165,38 155,28 Z" fill="#FFAA00"/>
    <circle cx="165" cy="28" r="6" fill="#FF3D00"/>
    <!-- Text Lines -->
    <rect x="18" y="20" width="75" height="6" rx="2" fill="#627D9F"/>
    <rect x="18" y="32" width="55" height="5" rx="2" fill="#8FA6C3"/>
    <rect x="18" y="58" width="110" height="5" rx="2" fill="#8FA6C3"/>
    <rect x="18" y="70" width="95" height="5" rx="2" fill="#8FA6C3"/>
    <rect x="18" y="82" width="80" height="5" rx="2" fill="#8FA6C3"/>
  </g>

  <!-- 2. MIDDLE CARD: PAN CARD (Rotated ~3 deg) -->
  <g transform="translate(130, 92) rotate(3)" filter="url(#cardShadow)">
    <rect width="215" height="135" rx="10" fill="url(#panGrad)" stroke="#A0BDDE" stroke-width="1.5"/>
    <!-- PAN Header -->
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0D2345" letter-spacing="0.5">PAN</text>
    <!-- Chip / Hologram area -->
    <rect x="155" y="18" width="34" height="20" rx="4" fill="#A0BDDE" opacity="0.45"/>
    <!-- Text Lines -->
    <rect x="16" y="46" width="95" height="5" rx="2" fill="#708BAE"/>
    <rect x="16" y="58" width="135" height="6" rx="2" fill="#426084"/>
    <rect x="16" y="72" width="115" height="5" rx="2" fill="#708BAE"/>
    <rect x="16" y="84" width="145" height="5" rx="2" fill="#708BAE"/>
    <rect x="16" y="98" width="85" height="5" rx="2" fill="#708BAE"/>
  </g>

  <!-- 3. FRONT CARD: DRIVING LICENSE (Facing forward, upright) -->
  <g transform="translate(85, 122)" filter="url(#cardShadow)">
    <rect width="235" height="145" rx="10" fill="url(#dlGrad)" stroke="#89AFD9" stroke-width="1.5"/>
    <!-- Header: DRIVING LICENSE -->
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#06142F" letter-spacing="0.3">DRIVING LICENSE</text>
    
    <!-- Photo Avatar -->
    <rect x="16" y="38" width="46" height="56" rx="6" fill="#D3E3F5" stroke="#90B3DC" stroke-width="1"/>
    <!-- Silhouette head -->
    <circle cx="39" cy="56" r="11" fill="#4A6B94"/>
    <!-- Silhouette shoulders -->
    <path d="M 23,88 C 23,76 31,71 39,71 C 47,71 55,76 55,88 Z" fill="#4A6B94"/>

    <!-- Text Lines -->
    <rect x="72" y="40" width="105" height="6" rx="2" fill="#1B365D"/>
    <rect x="72" y="52" width="135" height="5" rx="2" fill="#6280A5"/>
    <rect x="72" y="64" width="115" height="5" rx="2" fill="#6280A5"/>
    <rect x="72" y="76" width="140" height="5" rx="2" fill="#6280A5"/>
    <rect x="72" y="88" width="90" height="5" rx="2" fill="#6280A5"/>

    <!-- Barcode / QR pattern bottom right -->
    <rect x="170" y="106" width="50" height="24" rx="4" fill="#D7E5F5"/>
    <g fill="#3D5C82">
      <rect x="174" y="110" width="4" height="16"/>
      <rect x="181" y="110" width="2" height="16"/>
      <rect x="185" y="110" width="5" height="16"/>
      <rect x="193" y="110" width="3" height="16"/>
      <rect x="199" y="110" width="6" height="16"/>
      <rect x="208" y="110" width="4" height="16"/>
      <rect x="214" y="110" width="2" height="16"/>
    </g>

    <!-- Laser Scanning Beam (horizontal cyan/electric flare across Driving License) -->
    <rect x="-25" y="62" width="285" height="14" fill="url(#laserFlare)" filter="url(#laserGlow)"/>
    <line x1="-25" y1="69" x2="260" y2="69" stroke="url(#laserGrad)" stroke-width="3" filter="url(#laserGlow)"/>
    <circle cx="117" cy="69" r="6" fill="#FFFFFF" filter="url(#laserGlow)"/>
    <ellipse cx="117" cy="69" rx="16" ry="3" fill="#E0FFFF" filter="url(#laserGlow)"/>
  </g>

  <!-- 4. WHITE SCANNING CORNER BRACKETS [  ] -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))">
    <!-- Top Left Corner -->
    <path d="M 88,138 L 74,138 A 10 10 0 0 0 64,148 L 64,164" />
    <!-- Top Right Corner -->
    <path d="M 318,138 L 332,138 A 10 10 0 0 1 342,148 L 342,164" />
    <!-- Bottom Left Corner -->
    <path d="M 64,258 L 64,274 A 10 10 0 0 0 74,284 L 90,284" />
    <!-- Bottom Right Corner -->
    <path d="M 342,258 L 342,274 A 10 10 0 0 1 332,284 L 314,284" />
  </g>

  <!-- 5. VERIFIED BADGE (Circular Blue Badge with White Checkmark at bottom right) -->
  <g transform="translate(312, 252)" filter="url(#cardShadow)">
    <circle cx="24" cy="24" r="22" fill="#075BFF" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M 14,24 L 21,31 L 34,17" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
